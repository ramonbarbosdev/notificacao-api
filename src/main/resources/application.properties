spring.application.name=notificacao-api
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}?sslmode=${DB_SSLMODE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public
spring.jpa.properties.hibernate.default_schema=public

springdoc.swagger-ui.use-root-path=true
server.forward-headers-strategy=framework
springdoc.swagger-ui.path=/swagger-ui.html

app.swagger.server-url=${APP_SWAGGER_SERVER_URL}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES}

whatsapp.gateway.base-url=${WHATSAPP_GATEWAY_BASE_URL}
whatsapp.gateway.api-key=${WHATSAPP_GATEWAY_API_KEY}
whatsapp.conexao.cooldown-segundos=${WHATSAPP_CONEXAO_COOLDOWN_SEGUNDOS}

whatsapp.crypto.encryption-key=${WHATSAPP_CREDENTIAL_ENCRYPTION_KEY:}

whatsapp.meta.graph-base-url=${WHATSAPP_META_GRAPH_BASE_URL:https://graph.facebook.com}
whatsapp.meta.connect-timeout-ms=${WHATSAPP_META_CONNECT_TIMEOUT_MS:10000}
whatsapp.meta.read-timeout-ms=${WHATSAPP_META_READ_TIMEOUT_MS:30000}
whatsapp.meta.max-retries-transient=${WHATSAPP_META_MAX_RETRIES:2}

meta.webhook.verify-token=${META_WEBHOOK_VERIFY_TOKEN:}
meta.webhook.app-secret=${META_APP_SECRET:}

# Protecao operacional de envio
notificacao.protecao.limite-por-minuto=${NOTIFICACAO_LIMITE_POR_MINUTO}
notificacao.protecao.limite-por-hora=${NOTIFICACAO_LIMITE_POR_HORA}
notificacao.protecao.limite-por-dia=${NOTIFICACAO_LIMITE_POR_DIA}

# Delay aleatorio entre envios
notificacao.protecao.delay-minimo-segundos=${NOTIFICACAO_DELAY_MINIMO_SEGUNDOS}
notificacao.protecao.delay-maximo-segundos=${NOTIFICACAO_DELAY_MAXIMO_SEGUNDOS}

# Janela permitida de envio (desabilitada por padrao = envios 24h)
notificacao.protecao.janela-envio-habilitada=${NOTIFICACAO_JANELA_ENVIO_HABILITADA:false}
notificacao.protecao.inicio-permitido=${NOTIFICACAO_INICIO_PERMITIDO:00:00}
notificacao.protecao.fim-permitido=${NOTIFICACAO_FIM_PERMITIDO:23:59}
notificacao.protecao.fuso-horario=${NOTIFICACAO_FUSO_HORARIO}

# Retry e seguranca da sessao
notificacao.protecao.maximo-tentativas=${NOTIFICACAO_MAXIMO_TENTATIVAS}
notificacao.protecao.pausa-automatica-segundos=${NOTIFICACAO_PAUSA_AUTOMATICA_SEGUNDOS}
notificacao.protecao.pausa-risco-segundos=${NOTIFICACAO_PAUSA_RISCO_SEGUNDOS:1800}
notificacao.protecao.maximo-falhas-consecutivas=${NOTIFICACAO_MAXIMO_FALHAS_CONSECUTIVAS}
notificacao.protecao.decaimento-falhas-minutos=${NOTIFICACAO_DECAIMENTO_FALHAS_MINUTOS:30}
notificacao.protecao.limite-bloqueio-sessao-multiplicador=${NOTIFICACAO_LIMITE_BLOQUEIO_SESSAO_MULTIPLICADOR:2}
notificacao.protecao.janela-duplicidade-minutos=${NOTIFICACAO_JANELA_DUPLICIDADE_MINUTOS}

# Processamento da fila
notificacao.protecao.tamanho-lote-agendador=${NOTIFICACAO_TAMANHO_LOTE_AGENDADOR}
notificacao.protecao.intervalo-agendador-millis=${NOTIFICACAO_INTERVALO_AGENDADOR_MILLIS}
notificacao.protecao.tamanho-maximo-lote=${NOTIFICACAO_TAMANHO_MAXIMO_LOTE}
notificacao.protecao.recuperacao-processando-minutos=${NOTIFICACAO_RECUPERACAO_PROCESSANDO_MINUTOS:10}

server.port=${PORT}

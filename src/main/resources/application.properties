spring.application.name=notificacao-api
server.servlet.context-path=/api
server.port=${PORT:8086}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public
spring.jpa.properties.hibernate.default_schema=public

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.forward-headers-strategy=framework

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

whatsapp.gateway.base-url=${WHATSAPP_GATEWAY_BASE_URL:http://localhost:3001}
whatsapp.gateway.api-key=${WHATSAPP_GATEWAY_API_KEY}
whatsapp.conexao.cooldown-segundos=${WHATSAPP_CONEXAO_COOLDOWN_SEGUNDOS:30}

whatsapp.crypto.encryption-key=${WHATSAPP_CREDENTIAL_ENCRYPTION_KEY:}

whatsapp.meta.graph-base-url=${WHATSAPP_META_GRAPH_BASE_URL:https://graph.facebook.com}
whatsapp.meta.connect-timeout-ms=${WHATSAPP_META_CONNECT_TIMEOUT_MS:10000}
whatsapp.meta.read-timeout-ms=${WHATSAPP_META_READ_TIMEOUT_MS:30000}
whatsapp.meta.max-retries-transient=${WHATSAPP_META_MAX_RETRIES:2}

meta.webhook.verify-token=${META_WEBHOOK_VERIFY_TOKEN:}
meta.webhook.app-secret=${META_APP_SECRET:}

meta.app.id=${META_APP_ID:}
meta.app.embedded-signup-config-id=${META_EMBEDDED_SIGNUP_CONFIG_ID:}
meta.app.oauth-redirect-uri=${META_OAUTH_REDIRECT_URI:}

# Protecao operacional de envio (defaults globais da instalacao; override por org em organizacao_configuracao)
notificacao.protecao.limite-por-minuto=${NOTIFICACAO_LIMITE_POR_MINUTO:5}
notificacao.protecao.limite-por-hora=${NOTIFICACAO_LIMITE_POR_HORA:60}
notificacao.protecao.limite-por-dia=${NOTIFICACAO_LIMITE_POR_DIA:300}

notificacao.protecao.delay-minimo-segundos=${NOTIFICACAO_DELAY_MINIMO_SEGUNDOS:15}
notificacao.protecao.delay-maximo-segundos=${NOTIFICACAO_DELAY_MAXIMO_SEGUNDOS:60}

notificacao.protecao.janela-envio-habilitada=${NOTIFICACAO_JANELA_ENVIO_HABILITADA:false}
notificacao.protecao.inicio-permitido=${NOTIFICACAO_INICIO_PERMITIDO:08:00}
notificacao.protecao.fim-permitido=${NOTIFICACAO_FIM_PERMITIDO:18:00}
notificacao.protecao.fuso-horario=${NOTIFICACAO_FUSO_HORARIO:America/Bahia}

notificacao.protecao.maximo-tentativas=${NOTIFICACAO_MAXIMO_TENTATIVAS:3}
notificacao.protecao.pausa-automatica-segundos=${NOTIFICACAO_PAUSA_AUTOMATICA_SEGUNDOS:900}
notificacao.protecao.pausa-risco-segundos=${NOTIFICACAO_PAUSA_RISCO_SEGUNDOS:1800}
notificacao.protecao.maximo-falhas-consecutivas=${NOTIFICACAO_MAXIMO_FALHAS_CONSECUTIVAS:5}
notificacao.protecao.decaimento-falhas-minutos=${NOTIFICACAO_DECAIMENTO_FALHAS_MINUTOS:30}
notificacao.protecao.limite-bloqueio-sessao-multiplicador=${NOTIFICACAO_LIMITE_BLOQUEIO_SESSAO_MULTIPLICADOR:2}
notificacao.protecao.janela-duplicidade-minutos=${NOTIFICACAO_JANELA_DUPLICIDADE_MINUTOS:60}

notificacao.protecao.tamanho-lote-agendador=${NOTIFICACAO_TAMANHO_LOTE_AGENDADOR:1}
notificacao.protecao.intervalo-agendador-millis=${NOTIFICACAO_INTERVALO_AGENDADOR_MILLIS:5000}
notificacao.protecao.tamanho-maximo-lote=${NOTIFICACAO_TAMANHO_MAXIMO_LOTE:50}
notificacao.protecao.recuperacao-processando-minutos=${NOTIFICACAO_RECUPERACAO_PROCESSANDO_MINUTOS:10}
